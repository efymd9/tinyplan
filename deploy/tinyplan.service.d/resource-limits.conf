# Resource caps — install to /etc/systemd/system/tinyplan.service.d/ then
#   systemctl daemon-reload && systemctl restart tinyplan
#
# WHY: tinyplan shares a 2-vCPU / 8GB VPS with other apps (keloapp, susurra, …)
# and the box has run OUT of memory before (a global OOM-kill on 2026-06-14
# killed a co-tenant node process). Without a cap, an ad-traffic memory spike in
# tinyplan can trigger a BOX-WIDE OOM whose victim is chosen by the kernel — it
# may kill a co-tenant. These directives confine the blast radius to tinyplan's
# own cgroup and make tinyplan the preferred victim if a global OOM still occurs.
[Service]
# Soft limit: kernel throttles + reclaims tinyplan before the hard cap.
MemoryHigh=1200M
# Hard cap: hitting it triggers a per-cgroup OOM that kills ONLY tinyplan
# (which Restart=always brings back) instead of a box-wide victim.
MemoryMax=1500M
# Bound runaway thread/process growth.
TasksMax=512
# If a GLOBAL OOM still happens, prefer killing tinyplan over co-tenant apps.
OOMScoreAdjust=500
# (CPU is intentionally left uncapped: capping it would throttle tinyplan during
#  the very traffic spike we are preparing for; MemoryMax is the co-tenant guard.)
