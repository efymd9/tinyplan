# Systemd hardening drop-in. Mirrors the unit installed at
# /etc/systemd/system/tinyplan.service.d/hardening.conf on the live box, so a
# disaster-recovery rebuild reproduces the same hardened service instead of
# regressing to the bare unit. Install to
#   /etc/systemd/system/tinyplan.service.d/  then  systemctl daemon-reload
[Service]
# Keep User=root for now because the deployed app lives under /root/parentpath;
# moving it to /opt/tinyplan or /srv/tinyplan is required before a safe non-root switch.
# Keep HOSTNAME/next start bound to 0.0.0.0 per project notes: localhost binding breaks this app's Next proxy behavior.
NoNewPrivileges=true
UMask=0077
PrivateTmp=true
PrivateDevices=true
ProtectSystem=strict
ReadWritePaths=/root/parentpath/data /root/parentpath/.next/cache
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
LockPersonality=true
RestrictRealtime=true
RestrictSUIDSGID=true
SystemCallArchitectures=native
CapabilityBoundingSet=
RestrictNamespaces=true
ProcSubset=pid
ProtectProc=invisible
